name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # 판정 기록 DB 테스트를 운영과 같은 PostgreSQL로도 돌린다
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rescan
          POSTGRES_PASSWORD: rescan
          POSTGRES_DB: rescan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rescan" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      # AI를 부르지 않는 테스트만 (API 키 불필요)
      - run: python tests/test_judge.py
      - run: python tests/test_api.py
      - run: python tests/test_edge_cases.py
      - name: 판정 기록 · 피드백 · 관리자 (SQLite)
        run: python tests/test_store.py
      - name: 판정 기록 · 피드백 · 관리자 (PostgreSQL)
        run: python tests/test_store.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rescan:rescan@localhost:5432/rescan
      - name: 평가 결과 비교 스크립트
        run: python tests/test_compare_runs.py
  # MCP 서버: 도구 목록, 조회, 사진 판정(실제 백엔드 앱에 연결, AI는 가짜)
  mcp:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt -r mcp_server/requirements.txt
      - run: python tests/test_mcp.py

  # 컨테이너 이미지가 빌드되고 실제로 떠서 응답하는지 확인 (AI 호출 없음)
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: docker compose 설정 검사 (API + DB + Caddy)
        run: touch .env && docker compose -f deploy/docker-compose.yml config -q
        env:
          DOMAIN: example.sslip.io
          POSTGRES_PASSWORD: dummy
      - name: Build image
        run: docker build -t rescan-api backend
      - name: Run container
        run: docker run -d --name api -p 5001:5001 -e OPENAI_API_KEY=dummy rescan-api
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5001/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: HEAD /health (가동 감시 도구 방식)
        run: curl -fsSI http://localhost:5001/health
      - name: Smoke test /items
        run: curl -fsS http://localhost:5001/items | head -c 200
      - name: 관리자 기능은 토큰이 없으면 숨김 (404)
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/admin)" = "404"
      # 운영과 같은 설정(Sentry 켜짐)으로도 켜지는지. 2026-11-24 장애: CI에는 DSN이 없어 Sentry 초기화가
      # 실행되지 않았고, 새 메이저 버전에서 없어진 옵션 때문에 운영 서버에서만 API가 켜지지 않았다
      - name: Sentry를 켠 설정으로도 시작되는지
        run: |
          docker run -d --name api-sentry -p 5002:5001 -e OPENAI_API_KEY=dummy \
            -e SENTRY_DSN=https://public@o0.ingest.sentry.io/0 -e APP_ENV=ci rescan-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5002/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api-sentry
          exit 1
      - name: Container runs as non-root
        run: test "$(docker exec api id -u)" != "0"
      - name: Image size
        if: always()
        run: docker image ls rescan-api
